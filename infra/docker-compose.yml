version: '3.8'

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: benchmarks
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Application Services ────────────────────────────────────────────────────
  sandbox:
    build:
      context: ../sandbox
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # Mount Docker socket so sandbox can docker run contestant containers
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-uploads:/app/uploads
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build:
      context: ../orchestrator
      dockerfile: Dockerfile
    environment:
      - REDIS_ADDR=redis:6379
      - REDPANDA_ADDR=redpanda:9092
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      sandbox:
        condition: service_started
    restart: unless-stopped

  leaderboard:
    build:
      context: ../leaderboard/backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - REDIS_ADDR=redis:6379
      - SANDBOX_URL=http://sandbox:8080
      - JWT_SECRET=${JWT_SECRET:-iicpc-hackathon-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy
      sandbox:
        condition: service_started
    restart: unless-stopped

volumes:
  sandbox-uploads: